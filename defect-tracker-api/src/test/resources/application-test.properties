# PostgreSQL Datasource Configuration for Tests
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/defect_tracker_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration - clean-disabled=false allowed ONLY in test profile
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload Directory for Tests
app.storage.upload-dir=./build/test-uploads
