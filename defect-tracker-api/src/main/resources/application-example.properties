# Server Configuration
server.port=8087
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/defect_tracker_db
spring.datasource.username=postgres
spring.datasource.password=your_db_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.storage.upload-dir=./uploads

# Security & JWT Configuration (generate a 256-bit secret)
app.jwt.secret=your_strong_jwt_secret_hex_encoded_minimum_256_bits
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.password-reset-expiration-ms=3600000

# Seed Admin User
app.seed.admin.email=admin@defecttracker.com
app.seed.admin.username=US0001
app.seed.admin.password=your_secure_admin_password
app.seed.admin.first-name=System
app.seed.admin.last-name=Administrator

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8080,http://localhost:8086,http://127.0.0.1:5173

# OpenAPI Swagger 3 Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
